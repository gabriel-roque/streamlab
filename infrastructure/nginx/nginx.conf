events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2g;

    upstream streamlab_api {
        server api:8080;
    }

    upstream streamlab_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            proxy_pass http://streamlab_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://streamlab_api/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media is shared with the API so local storage works without another gateway.
        location /media/ {
            root /var/lib/streamlab;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header Access-Control-Expose-Headers "Cache-Control, ETag, X-Cache-Status" always;
            add_header X-Cache-Status "LOCAL" always;
        }

        location / {
            proxy_pass http://streamlab_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
