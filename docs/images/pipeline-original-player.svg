<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline from source file to player</title>
  <desc id="desc">Six-step flow: source upload, API, queue and worker, FFmpeg, playback artifacts, and player.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0d111a"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ed9d0"/>
    </marker>
    <style>
      .title { fill: #eef1f7; font: 700 30px Arial, Helvetica, sans-serif; letter-spacing: -0.8px; }
      .subtitle { fill: #7f8a9d; font: 15px Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #b9f227; font: 600 11px 'Courier New', monospace; letter-spacing: 2px; }
      .card { fill: #0d111a; stroke: #242c39; stroke-width: 1.5; }
      .card-label { fill: #7f8a9d; font: 11px 'Courier New', monospace; letter-spacing: 1.2px; }
      .card-title { fill: #eef1f7; font: 700 17px Arial, Helvetica, sans-serif; }
      .card-copy { fill: #aeb7c5; font: 13px Arial, Helvetica, sans-serif; }
      .code { fill: #5ed9d0; font: 12px 'Courier New', monospace; }
      .number { fill: #07090f; font: 700 12px 'Courier New', monospace; }
      .foot { fill: #7f8a9d; font: 12px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M 40 116 H 1240" stroke="#242c39"/>
  <text x="40" y="48" class="eyebrow">STREAMLAB / PIPELINE</text>
  <text x="40" y="86" class="title">Source file to player</text>
  <text x="900" y="79" class="subtitle">one path, two outputs</text>

  <g transform="translate(40 208)">
    <rect class="card" width="180" height="250" rx="5"/>
    <circle cx="25" cy="25" r="15" fill="#b9f227"/>
    <text x="25" y="29" text-anchor="middle" class="number">01</text>
    <text x="20" y="74" class="card-label">INPUT</text>
    <text x="20" y="107" class="card-title">Source file</text>
    <rect x="20" y="133" width="140" height="67" rx="3" fill="#121823" stroke="#384557"/>
    <path d="M 43 153 h 31 l 10 10 v 23 h -41 z" fill="none" stroke="#5ed9d0" stroke-width="2"/>
    <path d="M 74 153 v 11 h 10" fill="none" stroke="#5ed9d0" stroke-width="2"/>
    <text x="96" y="163" class="code">video.mp4</text>
    <text x="96" y="182" class="foot">raw media</text>
    <text x="20" y="229" class="card-copy">Upload multipart</text>
  </g>

  <path d="M 226 333 H 252" fill="none" stroke="#5ed9d0" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(264 208)">
    <rect class="card" width="180" height="250" rx="5"/>
    <circle cx="25" cy="25" r="15" fill="#5ed9d0"/>
    <text x="25" y="29" text-anchor="middle" class="number">02</text>
    <text x="20" y="74" class="card-label">API GO</text>
    <text x="20" y="107" class="card-title">Receives + records</text>
    <rect x="20" y="133" width="140" height="67" rx="3" fill="#121823" stroke="#384557"/>
    <path d="M 44 151 h 42 M 44 165 h 65 M 44 179 h 49" stroke="#5ed9d0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="133" cy="164" r="11" fill="none" stroke="#b9f227" stroke-width="2"/>
    <path d="M 128 164 l 4 4 7 -8" fill="none" stroke="#b9f227" stroke-width="2"/>
    <text x="20" y="229" class="card-copy">Stores + returns 202</text>
  </g>

  <path d="M 450 333 H 476" fill="none" stroke="#5ed9d0" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(488 208)">
    <rect class="card" width="180" height="250" rx="5"/>
    <circle cx="25" cy="25" r="15" fill="#5ed9d0"/>
    <text x="25" y="29" text-anchor="middle" class="number">03</text>
    <text x="20" y="74" class="card-label">QUEUE + WORKER</text>
    <text x="20" y="107" class="card-title">Processing</text>
    <rect x="20" y="133" width="140" height="67" rx="3" fill="#121823" stroke="#384557"/>
    <circle cx="55" cy="166" r="15" fill="none" stroke="#ff6e75" stroke-width="2"/>
    <path d="M 55 157 v 10 l 7 5" fill="none" stroke="#ff6e75" stroke-width="2"/>
    <path d="M 91 151 h 42 M 91 166 h 31 M 91 181 h 39" stroke="#7f8a9d" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="229" class="card-copy">Async job</text>
  </g>

  <path d="M 674 333 H 700" fill="none" stroke="#5ed9d0" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(712 208)">
    <rect class="card" width="180" height="250" rx="5"/>
    <circle cx="25" cy="25" r="15" fill="#ff6e75"/>
    <text x="25" y="29" text-anchor="middle" class="number">04</text>
    <text x="20" y="74" class="card-label">FFMPEG</text>
    <text x="20" y="107" class="card-title">Transcodes</text>
    <rect x="20" y="133" width="140" height="67" rx="3" fill="#121823" stroke="#384557"/>
    <path d="M 42 153 h 93 v 29 h -93 z" fill="none" stroke="#ff6e75" stroke-width="2"/>
    <path d="M 55 168 l 8 -7 8 14 10 -10 11 11 11 -13 16 13" fill="none" stroke="#ff6e75" stroke-width="2"/>
    <text x="20" y="229" class="card-copy">H.264 / AAC</text>
  </g>

  <path d="M 898 333 H 924" fill="none" stroke="#5ed9d0" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(936 208)">
    <rect class="card" width="180" height="250" rx="5"/>
    <circle cx="25" cy="25" r="15" fill="#b9f227"/>
    <text x="25" y="29" text-anchor="middle" class="number">05</text>
    <text x="20" y="74" class="card-label">ARTIFACTS</text>
    <text x="20" y="107" class="card-title">Playback ready</text>
    <rect x="20" y="133" width="140" height="67" rx="3" fill="#121823" stroke="#384557"/>
    <rect x="39" y="153" width="48" height="30" rx="2" fill="#5ed9d0" opacity=".85"/>
    <rect x="93" y="153" width="48" height="30" rx="2" fill="#ff6e75" opacity=".85"/>
    <text x="43" y="172" fill="#07090f" font="600 10px 'Courier New', monospace">MP4</text>
    <text x="99" y="172" fill="#07090f" font="600 10px 'Courier New', monospace">HLS</text>
    <text x="20" y="229" class="card-copy">manifest + segments</text>
  </g>

  <path d="M 1122 333 H 1148" fill="none" stroke="#5ed9d0" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <g transform="translate(1160 208)">
    <rect width="80" height="250" rx="5" fill="#121823" stroke="#5ed9d0" stroke-width="1.5"/>
    <circle cx="40" cy="48" r="22" fill="#07090f" stroke="#5ed9d0" stroke-width="2"/>
    <path d="M 35 38 l 16 10 -16 10 z" fill="#b9f227"/>
    <text x="40" y="107" text-anchor="middle" class="card-label">06</text>
    <text x="40" y="139" text-anchor="middle" class="card-title" font-size="15">Player</text>
    <text x="40" y="169" text-anchor="middle" class="card-copy">plays</text>
    <text x="40" y="188" text-anchor="middle" class="card-copy">and measures</text>
  </g>

  <rect x="40" y="528" width="1200" height="108" rx="5" fill="#0d111a" stroke="#242c39"/>
  <text x="66" y="564" class="eyebrow">WHAT CHANGES?</text>
  <text x="66" y="597" class="card-copy">MP4: one file. HLS: manifest + short segments.</text>
  <text x="66" y="619" class="card-copy">The player adapts quality to network and buffer.</text>
  <circle cx="1106" cy="580" r="5" fill="#b9f227"/>
  <text x="1121" y="585" class="foot">READY</text>
</svg>
